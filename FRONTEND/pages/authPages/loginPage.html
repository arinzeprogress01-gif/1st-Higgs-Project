
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | Task 2.0</title>

    <link rel="stylesheet" href="../styles/loginPage.css">
</head>

<body>

    <div Class="login-container">

        <div Class="left-section">

            <div Class="overlay"></div>

            <div Class="left-content">

                <h1 Class="main-title">
                    Welcome <br>
                    Back
                </h1>

                <p Class="main-text">
                    Continue managing your goals, tracking your progress,
                    and building productivity with Task 2.0.
                </p>

                <img Class="login-image" src="../Images/images.jpg"
                    alt="Task Illustration">

            </div>

        </div>

        <div Class="right-section">

            <div Class="login-card">

                <h2 Class="login-title">
                    Sign In
                </h2>

                <form>

                    <input type="email" placeholder="Email Address" Class="input-field">

                    <input type="password" placeholder="Password" Class="input-field">

                    <div Class="remember-row">

                        <label>
                            <input type="checkbox">
                            Remember Me
                        </label>

                        <a href="../authPages/forgetPasswordPage.html" Class="forgot-link">
                            Forgot Password?
                        </a>

                    </div>

                    <button Class="login-btn">
                        Login
                    </button>

                </form>
                
                <p Class="bottom-text">
                    Don't have an account?
                    <a href="../authPages/resgisterPages.html">Register</a>
                </p>

            </div>

        </div>

    </div>

</body>

</html>
