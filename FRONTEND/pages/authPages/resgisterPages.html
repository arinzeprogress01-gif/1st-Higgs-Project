
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register | Task 2.0</title>

    <link rel="stylesheet" href="../styles/registerPage.css">
</head>

<body>

    <div Class="register-container">

        <div Class="left-section">

            <h1 Class="main-title">
                Join <br>
                Task 2.0
            </h1>

            <p Class="main-text">
                Create your account and begin your journey into a smarter,
                more productive task management experience.
            </p>

            <img Class="register-image" src="../Images/download.jpg"
                alt="Task Image">

        </div>

        <div Class="right-section">

            <div Class="form-card">

                <h2 Class="form-title">
                    Create Account
                </h2>

                <form id="registerForm">

                    <input type="text" id="name" placeholder="Full Name" Class="input-field">

                    <input type="email" id="email" placeholder="Email Address" Class="input-field">

                    <input type="password" id="password" placeholder="Password" Class="input-field">

                    <input type="password" id="confirmPassword" placeholder="Confirm Password" Class="input-field">

                    <select name="category" id="category" Class="input-field">
                    
                        <option value="" disabled selected>
                            Select System Type
                        </option>
                    
                        <option value="personal">
                            Personal
                        </option>
                    
                        <option value="professional">
                            Professional
                        </option>
                    
                        <option value="todo-List">
                            To-Do List
                        </option>
                    
                    </select>
                    
                    <button type="submit" Class="register-btn">
                        Create Account
                    </button>

                </form>

                <p Class="bottom-text">
                    Already have an account?
                    <a href="../authPages/loginPage.html">Login</a>
                </p>

            </div>

        </div>

    </div>

</body>

<script src="../javascript/registerPage.js"></script>

</html>
