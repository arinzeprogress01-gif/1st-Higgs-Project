<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>
        Personal Dashboard | Task 2.0
    </title>

    <link rel="stylesheet" href="../styles/personalDashboard.css">

</head>

<body>

    <div Class="dashboard-container">


        <aside Class="sidebar">

            <div Class="logo-section">

                <h1 Class="logo-text">
                    TASK 2.0
                </h1>

            </div>

            <nav Class="sidebar-nav">

                <a href="../dashboard/personalDashboard.html" Class="nav-item"
                id="dashboardBtn">
                    Dashboard
                </a>

                <a href="../dashboard/tasksPage.html" Class="nav-item"
                id="tasksBtn">
                    Tasks
                </a>

                <a href="../dashboard/completedPage.html" Class="nav-item"
                id="completedBtn">
                    Completed
                </a>

                <a href="../dashboard/overduePage.html" Class="nav-item"
                id="overdueBtn">
                    Overdue
                </a>

                <a href="../dashboard/diaryPage.html" Class="nav-item"
                id="diaryBtn">
                    Diary
                </a>

                <a href="../dashboard/analyticsPage.html" Class="nav-item"
                id="analyticsBtn">
                    Analytics
                </a>

                <a href="../dashboard/historyPage.html" Class="nav-item" id="historyBtn">
                    History
                </a>

                <a href="../dashboard/profilePage.html" Class="nav-item"
                id="profileBtn">
                    Profile
                </a>

                <a href="#" Class="nav-item logout-btn" id="logoutBtn">
                    Logout
                </a>

            </nav>

        </aside>

        <!-- MAIN CONTENT -->

        <main Class="main-content">

            <!-- TOPBAR -->

            <header Class="topbar">
                
                <div>

                    <h2 Class="welcome-text" id="welcomeText">
                    </h2>

                    <p Class="date-text">
                        Stay productive today.
                    </p>

                </div>
                <a href="../dashboard/tasksPage.html">
                    <button Class="create-task-btn" id="openModalbtn">
                        + Create Task
                    </button>
                </a>
                

            </header>

            <!-- STATS -->

            <section Class="stats-section">

                <div Class="stat-card">

                    <h3>
                        Total Tasks
                    </h3>

                    <p id="totalTasks">
                        0
                    </p>

                </div>

                <div Class="stat-card">

                    <h3>
                        Completed
                    </h3>

                    <p id="completedTasks">
                        0
                    </p>

                </div>

                <div Class="stat-card">

                    <h3>
                        Pending
                    </h3>

                    <p id="pendingTasks">
                        0
                    </p>

                </div>

                <div Class="stat-card">

                    <h3>
                        Overdue
                    </h3>

                    <p id="overdueTasks">
                        0
                    </p>

                </div>

                <div Class="analytics-section">
                
                    <div Class="analytics-card">
                
                        <h3>
                            Completion Rate
                        </h3>
                
                        <h1 id="completionRate">
                            0%
                        </h1>
                
                    </div>
                
                    <div Class="analytics-card">
                
                        <h3>
                            Productivity Score
                        </h3>
                
                        <h1 id="productivityScore">
                            0
                        </h1>
                
                    </div>
                
                </div>

            </section>

            <div Class="search-bar">
            
                <input type="text" id="searchInput" Class="search-input"  placeholder="Search tasks...">
            
            </div>

            <div Class="filter-bar">
            
                <button Class="filter-btn active-filter" data-filter="all">
                    All
                </button>
            
                <button Class="filter-btn" data-filter="pending">
                    Pending
                </button>
            
                <button Class="filter-btn" data-filter="completed">
                    Completed
                </button>
            
                <button Class="filter-btn" data-filter="overdue">
                    Overdue
                </button>
            
            </div>

            <section Class="task-feed">

                <div Class="task-card"
                id="taskFeed"
                >
            </section>

        </main>

        <!-- CREATE TASK MODAL -->
        
        <div Class="modal-overlay" id="taskModal">
        
            <div Class="modal-content">
        
                <div Class="modal-top">
        
                    <h2>
                        Create New Task
                    </h2>
        
                    <button id="closeModalBtn">
                        ✕
                    </button>
        
                </div>
        
                <form id="taskForm">
        
                    <input type="text" id="task" placeholder="Task Title" 
                    Class="modal-input"
                    >
        
                    <textarea id="description" placeholder="Task Description" Class="modal-textarea"></textarea>
        
                    <select id="priority" Class="modal-input">
        
                        <option value="">
                            Select Priority
                        </option>
        
                        <option value="low">
                            Low
                        </option>
        
                        <option value="medium">
                            Medium
                        </option>
        
                        <option value="high">
                            High
                        </option>
        
                    </select>

                    <input type="datetime-local" id="dueDate" Class="modal-input">
        
                    <button type="submit" Class="submit-task-btn">
                        Create Task
                    </button>
        
                </form>
        
            </div>
        
        </div>

        <div Class="modal-overlay" id="editTaskModal">
        
            <div Class="modal-content">
        
                <div Class="modal-top">
        
                    <h2>
                        Update Task
                    </h2>
        
                    <button id="closeEditModal">
                        ✕
                    </button>
        
                </div>
        
                <form id="editTaskForm">
        
                    <input type="text" id="editTask" Class="modal-input" placeholder="Task Title">
        
                    <textarea id="editDescription" placeholder="Task Description" Class="modal-textarea"></textarea>
        
                    <select id="editPriority" Class="modal-input">
        
                        <option value="low">
                            Low
                        </option>
        
                        <option value="medium">
                            Medium
                        </option>
        
                        <option value="high">
                            High
                        </option>
        
                    </select>
        
                    <input type="datetime-local" id="editDueDate" Class="modal-input">
        
                    <button type="submit" Class="submit-task-btn">
                        Update Task
                    </button>
        
                </form>
        
            </div>
        
        </div>

        <div Class="modal-overlay" id="deleteModal">
        
            <div Class="modal-content delete-modal-content">
        
                <h2>
                    Delete Task
                </h2>
        
                <p Class="delete-text">
                    Are you sure you want to delete this task?
                </p>
        
                <div Class="delete-actions">
        
                    <button id="cancelDeleteBtn" Class="cancel-delete-btn">
                        Cancel
                    </button>
        
                    <button id="confirmDeleteBtn" Class="confirm-delete-btn">
                        Delete
                    </button>
        
                </div>
        
            </div>
        
        </div>
    </div>
<div id="toast"></div>
</body>

<script src="../javascript/personalDashboard.js"></script>
</html>
