<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>
        Personal Dashboard | Task 2.0
    </title>

    <link rel="stylesheet" href="../styles/personalDashboard.css">

</head>

<body>

    <div Class="dashboard-container">


        <aside Class="sidebar">

            <div Class="logo-section">

                <h1 Class="logo-text">
                    TASK 2.0
                </h1>

            </div>

            <nav Class="sidebar-nav">

                <a href="#" Class="nav-item" active>
                    Dashboard
                </a>

                <a href="#" Class="nav-item">
                    Tasks
                </a>

                <a href="#" Class="nav-item">
                    Completed
                </a>

                <a href="#" Class="nav-item">
                    Overdue
                </a>

                <a href="#" Class="nav-item">
                    Diary
                </a>

                <a href="#" Class="nav-item">
                    Analytics
                </a>

                <a href="#" Class="nav-item">
                    Profile
                </a>

                <a href="#" Class="nav-item logout-btn">
                    Logout
                </a>

            </nav>

        </aside>

        <!-- MAIN CONTENT -->

        <main Class="main-content">

            <!-- TOPBAR -->

            <header Class="topbar">
                
                <div>

                    <h2 Class="welcome-text">
                        Welcome Back 👋
                    </h2>

                    <p Class="date-text">
                        Stay productive today.
                    </p>

                </div>

                <button Class="create-task-btn">
                    + Create Task
                </button>

            </header>

            <!-- STATS -->

            <section Class="stats-section">

                <div Class="stat-card">

                    <h3>
                        Total Tasks
                    </h3>

                    <p>
                        24
                    </p>

                </div>

                <div Class="stat-card">

                    <h3>
                        Completed
                    </h3>

                    <p>
                        12
                    </p>

                </div>

                <div Class="stat-card">

                    <h3>
                        Pending
                    </h3>

                    <p>
                        8
                    </p>

                </div>

                <div Class="stat-card">

                    <h3>
                        Overdue
                    </h3>

                    <p>
                        4
                    </p>

                </div>

            </section>

            <!-- TASK FEED -->

            <section Class="task-feed">

                <div Class="task-card">

                    <div Class="task-top">

                        <h3>
                            Finish UI Design
                        </h3>

                        <span Class="priority high">
                            High
                        </span>

                    </div>

                    <p Class="task-description">
                        Complete the personal dashboard
                        layout and interactions.
                    </p>

                    <div Class="task-bottom">

                        <span>
                            2 hours ago
                        </span>

                        <button Class="complete-btn">
                            Complete
                        </button>

                    </div>

                </div>

            </section>

        </main>

    </div>

</body>

</html>
