<!DOCTYPE html>
<html lang="en">



<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>
        Task 2.0 • Forget Password
    </title>

    <meta name="description" content="
        Task 2.0 is a modern productivity
        and task management platform
        featuring analytics, reminders,
        profiles, diaries, and smart workflows.
        " />

    <meta name="keywords" content="
        productivity,
        task manager,
        to-do app,
        dashboard,
        workflow
        " />

    <meta name="author" content="Pagen Higgs" />

    <meta name="theme-color" content="#0f172a" />

    <meta property="og:title" content="Task 2.0" />

    <meta property="og:description" content="
        Smart productivity and task
        management system.
        " />

    <meta property="og:image" content="../assets/favicon/762686.png" />

    <meta property="og:type" content="website" />

    <meta property="og:url" content="https://1st-higgs-project.vercel.app">

    <meta name="twitter:card" content="summary_large_image" />

    <link rel="icon" type="image/png" href="../assets/favicon/762686.png" />

    <link rel="apple-touch-icon" href="../assets/favicon/762686.png" />

    <link rel="stylesheet" href="../styles/global.css">

    <link rel="stylesheet" href="../styles/forgetPasswordPage.css">

</head>



<body>

    <div Class="forgot-container">

        <div Class="left-section">

            <div Class="overlay"></div>

            <div Class="left-content">

                <h1 Class="main-title">
                    Reset <br>
                    Password
                </h1>

                <p Class="main-text">
                    Don’t worry. It happens sometimes.
                    Enter your email address and we’ll help you regain access
                    to your Task 2.0 account.
                </p>

                <img Class="forgot-image" src="/Images/download (1).jpg"
                    alt="Reset Password Illustration">

            </div>

        </div>

        <div Class="right-section">

            <div Class="forgot-card">

                <h2 Class="card-title">
                    Forgot Password?
                </h2>

                <p Class="card-text">
                    Enter your registered email below.
                </p>

                <form id="forgotPasswordForm">

                    <input type="email" id="email" placeholder="Enter Your Email" Class="input-field">

                    <input type="password" id="newPassword" placeholder="Enter Your New Password" Class="input-field">

                    <input type="password" id="confirmNewPassword" placeholder="Confirm Your New Password" Class="input-field">

                    <button type="submit" Class="reset-btn">
                        Reset Password
                    </button>

                </form>

                <p Class="bottom-text">
                    Remember your password?
                    <a href="/authPages/loginPage.html">Login</a>
                </p>

            </div>

        </div>

    </div>
<div id="toast"></div>

</body>

<script src="/javascript/forgetPasswordPage.js"></script>
</html>
