
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>
        Task 2.0 • Login
    </title>

    <meta name="description" content="
        Task 2.0 is a modern productivity
        and task management platform
        featuring analytics, reminders,
        profiles, diaries, and smart workflows.
        " />

    <meta name="keywords" content="
        productivity,
        task manager,
        to-do app,
        dashboard,
        workflow
        " />

    <meta name="author" content="Pagen Higgs" />

    <meta name="theme-color" content="#0f172a" />

    <meta property="og:title" content="Task 2.0" />

    <meta property="og:description" content="
        Smart productivity and task
        management system.
        " />

    <meta property="og:image" content="../assets/favicon/762686.png" />

    <meta property="og:type" content="website" />

    <meta property="og:url" content="https://1st-higgs-project.vercel.app">

    <meta name="twitter:card" content="summary_large_image" />

    <link rel="icon" type="image/png" href="../assets/favicon/762686.png" />

    <link rel="apple-touch-icon" href="../assets/favicon/762686.png" />

    <link rel="manifest" href="/pwa/manifest.json" />

    <link rel="stylesheet" href="../styles/global.css">

    <link rel="stylesheet" href="../styles/loginPage.css">

</head>

<body>

    <div Class="login-container">

        <div Class="left-section">

            <div Class="overlay"></div>

            <div Class="left-content">

                <h1 Class="main-title">
                    Welcome <br>
                    Back
                </h1>

                <p Class="main-text">
                    Continue managing your goals, tracking your progress,
                    and building productivity with Task 2.0.
                </p>

                <img Class="login-image" src="/Images/images.jpg"
                    alt="Task Illustration">

            </div>

        </div>

        <div Class="right-section">

            <div Class="login-card">

                <h2 Class="login-title">
                    Sign In
                </h2>

                <form id="loginForm">

                    <input type="email" id="email" placeholder="Email Address" Class="input-field">

                    <input type="password" id="password" placeholder="Password" Class="input-field">

                    <div Class="remember-row">

                        <label>
                            <input type="checkbox">
                            Remember Me
                        </label>

                        <a href="/authPages/forgetPasswordPage.html" Class="forgot-link">
                            Forgot Password?
                        </a>

                    </div>

                    <button type="submit" Class="login-btn">
                        Login
                    </button>

                </form>
                
                <p Class="bottom-text">
                    Don't have an account?
                    <a href="/authPages/registerPages.html">Register</a>
                </p>

            </div>

        </div>

    </div>
<div id="toast"></div>
</body>
<script src="/javascript/loginPage.js"></script>
</html>
