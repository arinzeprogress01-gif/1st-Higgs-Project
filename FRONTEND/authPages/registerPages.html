
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>
        Task 2.0 • Register Page
    </title>

    <meta name="description" content="
        Task 2.0 is a modern productivity
        and task management platform
        featuring analytics, reminders,
        profiles, diaries, and smart workflows.
        " />

    <meta name="keywords" content="
        productivity,
        task manager,
        to-do app,
        dashboard,
        workflow
        " />

    <meta name="author" content="Pagen Higgs" />

    <meta name="theme-color" content="#0f172a" />

    <meta property="og:title" content="Task 2.0" />

    <meta property="og:description" content="
        Smart productivity and task
        management system.
        " />

    <meta property="og:image" content="../assets/favicon/762686.png" />

    <meta property="og:type" content="website" />

    <meta property="og:url" content="https://1st-higgs-project.vercel.app">

    <meta name="twitter:card" content="summary_large_image" />

    <link rel="icon" type="image/png" href="../assets/favicon/762686.png" />

    <link rel="apple-touch-icon" href="../assets/favicon/762686.png" />

    <link rel="stylesheet" href="../styles/global.css">

    <link rel="stylesheet" href="../styles/registerPage.css">

</head>

<body>

    <div Class="register-container">

        <div Class="left-section">

            <h1 Class="main-title">
                Join <br>
                Task 2.0
            </h1>

            <p Class="main-text">
                Create your account and begin your journey into a smarter,
                more productive task management experience.
            </p>

            <img Class="register-image" src="/Images/download.jpg"
                alt="Task Image">

        </div>

        <div Class="right-section">

            <div Class="form-card">

                <h2 Class="form-title">
                    Create Account
                </h2>

                <form id="registerForm">

                    <input type="text" id="name" placeholder="Full Name" Class="input-field" required>

                    <input type="email" id="email" placeholder="Email Address" Class="input-field" required>

                    <input type="password" id="password" placeholder="Password" Class="input-field" required>

                    <input type="password" id="confirmPassword" placeholder="Confirm Password" Class="input-field" required>

                    <select name="category" id="category" Class="input-field" required>
                    
                        <option value="">
                            Select System Type
                        </option>
                    
                        <option value="personal">
                            Personal
                        </option>
                    
                        <option value="professional">
                            Professional
                        </option>
                    
                        <option value="todo-List">
                            To-Do List
                        </option>
                    
                    </select>
                    
                    <button type="submit" Class="register-btn">
                        Create Account
                    </button>

                </form>

                <p Class="bottom-text">
                    Already have an account?
                    <a href="/authPages/loginPage.html">Login</a>
                </p>

            </div>

        </div>

    </div>
<div id="toast"></div>

<script src="/javascript/registerPage.js"></script>
</body>

</html>
